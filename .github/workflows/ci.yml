name: ci

# nodejs-store 质量门禁（评测报告 m-5 / m-6）：
#   1. eslint（零告警门禁，规则从现有风格反推，见 eslint.config.mjs）
#   2. 测试 + c8 覆盖率门禁（statements/lines 90、functions 85、branches 75）
#
# 说明：rust-store-node（Rust 原生核心）已发布到 npm（2.0.0 起），CI 直接安装该依赖。
# 本地开发走 LOCAL_CORE=1 兜底（scripts/test.js 自动开启，从相邻 rust-store/
# core-node/dist 加载）；CI 无相邻仓库，兜底自然失败后回落到 npm 依赖（见 src/core.js）。
#
# 三库就绪（D2：不静默跳过）：测试套件以真实 MySQL / PostgreSQL / MongoDB 跑
# real-backends-e2e / federation-e2e / scenario-course-platform，
# 缺任一后端会走显式 skip 并连带拉低 src/executors、src/introspect 覆盖率、
# 使门禁失败 —— 故 CI 起三个真实服务，库名/账号与测试默认 URI 对齐
# （`e2e/e2e123`；MySQL `mongo_store_e2e{,_real,_fed}`，PG `mongo_store_e2e{,_real}`）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    name: lint + test (coverage gate)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: e2e
          MYSQL_PASSWORD: e2e123
          MYSQL_DATABASE: mongo_store_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e123
          POSTGRES_DB: mongo_store_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U e2e"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      # tests/scheduler.test.js 的 cron 对拍 fixture 单一事实源在 rust-store 仓
      # （fixtures/triggers/cases.json，与 py-store/tests/test_scheduler.py 双宿主共用）；
      # actions/checkout 不允许逃逸 workspace，故 checkout 到 workspace 内 rust-store/，
      # 测试按候选路径探测（本地 common-store 布局仍走平级 ../rust-store）。
      - uses: actions/checkout@v4
        with:
          repository: coenddt/rust-store
          path: rust-store
      # 工作流 T5-09（跨步骤原子回滚）依赖 MongoDB 事务：单机 mongod 须以 --replSet 启动。
      # services 的 options 是 docker create flags，容器 command 传不进去（exit 125），
      # 故用 step 内 docker run 自管 mongo 生命周期；客户端用容器内 mongosh。
      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 mongod --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval 'try { rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]}) } catch (e) {}' && break
            sleep 2
          done
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true && exit 0
            sleep 2
          done
          echo "mongo PRIMARY 未就绪" && exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 测试用独立库（real / fed）需先建库并授权；服务镜像只创建了 mongo_store_e2e
      - name: Prepare MySQL databases
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "
            CREATE DATABASE IF NOT EXISTS mongo_store_e2e_real;
            CREATE DATABASE IF NOT EXISTS mongo_store_e2e_fed;
            GRANT ALL ON mongo_store_e2e_real.* TO 'e2e'@'%';
            GRANT ALL ON mongo_store_e2e_fed.*  TO 'e2e'@'%';
            FLUSH PRIVILEGES;"
      - name: Prepare PostgreSQL databases
        env:
          PGPASSWORD: e2e123
        run: |
          psql -h 127.0.0.1 -U e2e -d postgres -c 'CREATE DATABASE mongo_store_e2e_real';
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Check SPEC snippets
        run: node scripts/check-spec-snippets.js
      - name: Test + coverage gate
        run: npm run test:coverage
