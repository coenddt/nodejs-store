name: ci

# nodejs-store 质量门禁（评测报告 m-5 / m-6）：
#   1. eslint（零告警门禁，规则从现有风格反推，见 eslint.config.mjs）
#   2. 测试 + c8 覆盖率门禁（statements/lines 90、functions 85、branches 75）
#
# 说明：rust-store-node（Rust 原生核心）已发布到 npm（2.0.0 起），CI 直接安装该依赖。
# 本地开发走 LOCAL_CORE=1 兜底（scripts/test.js 自动开启，从相邻 rust-store/
# core-node/dist 加载）；CI 无相邻仓库，兜底自然失败后回落到 npm 依赖（见 src/core.js）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    name: lint + test (coverage gate)
    runs-on: ubuntu-latest
    # 场景矩阵（tests/scenario-course-platform.test.js）以 Mongo 结果作 oracle 对拍
    # SQL 后端，缺 oracle 时 H/J 组「行集一致性」用例无法判定 —— 故 CI 起真实 mongod。
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Test + coverage gate
        run: npm run test:coverage
